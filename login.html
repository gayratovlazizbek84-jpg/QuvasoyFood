<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aseria POS — Staff Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    :root {
      --pos-bg: #151619;
      --pos-card-bg: #212328;
      --pos-card-hover: #262930;
      --pos-border: rgba(255, 255, 255, 0.08);
      --pos-border-focus: rgba(255, 100, 34, 0.5);
      --pos-primary: #ff6422;
      --pos-primary-hover: #ff783d;
      --pos-primary-glow: rgba(255, 100, 34, 0.35);
      --pos-text-main: #ffffff;
      --pos-text-muted: #8b92a0;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--pos-bg);
      color: var(--pos-text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glows */
    .bg-glow-1 {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 100, 34, 0.12) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 100, 34, 0.08) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .auth-card {
      background-color: var(--pos-card-bg);
      border: 1px solid var(--pos-border);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      text-align: center;
    }

    /* 4-dot diamond logo */
    .diamond-dots {
      position: relative;
      width: 28px;
      height: 28px;
      margin-bottom: 16px;
    }

    .diamond-dots .dot {
      position: absolute;
      width: 7px;
      height: 7px;
      background-color: var(--pos-primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--pos-primary-glow);
    }

    .diamond-dots .dot.top    { top: 0; left: 10.5px; }
    .diamond-dots .dot.left   { top: 10.5px; left: 0; }
    .diamond-dots .dot.right  { top: 10.5px; right: 0; }
    .diamond-dots .dot.bottom { bottom: 0; left: 10.5px; }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--pos-text-muted);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #cfd4dc;
      display: flex;
      justify-content: space-between;
    }

    .form-label a {
      color: var(--pos-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 12px;
    }

    .form-label a:hover {
      text-decoration: underline;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg {
      position: absolute;
      left: 16px;
      color: #6d7380;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background-color: #17181c;
      border: 1px solid var(--pos-border);
      border-radius: 14px;
      padding: 13px 16px 13px 44px;
      font-family: var(--font-main);
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--pos-primary);
      background-color: #1c1d22;
      box-shadow: 0 0 0 3px rgba(255, 100, 34, 0.15);
    }

    .form-input::placeholder {
      color: #555b68;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: #6d7380;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--pos-text-muted);
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-label input[type="checkbox"] {
      accent-color: var(--pos-primary);
      width: 15px;
      height: 15px;
      border-radius: 4px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background-color: var(--pos-primary);
      border: none;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px var(--pos-primary-glow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: var(--pos-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 100, 34, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .divider-row {
      display: flex;
      align-items: center;
      margin: 22px 0 16px 0;
      color: #555b68;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .divider-row::before,
    .divider-row::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--pos-border);
    }

    .divider-row span {
      padding: 0 12px;
    }

    .btn-demo-login {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--pos-border);
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-demo-login:hover {
      background-color: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13.5px;
      color: var(--pos-text-muted);
    }

    .auth-footer a {
      color: var(--pos-primary);
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .alert-box {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .alert-box.error {
      display: block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-box.success {
      display: block;
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Brand Logo & Title -->
      <div class="brand-header">
        <div class="diamond-dots">
          <span class="dot top"></span>
          <span class="dot left"></span>
          <span class="dot right"></span>
          <span class="dot bottom"></span>
        </div>
        <h1 class="brand-title">Aseria POS</h1>
        <p class="brand-subtitle">Restaurant Staff & Terminal Login</p>
      </div>

      <!-- Alert Notification -->
      <div class="alert-box" id="authAlert"></div>

      <!-- Login Form -->
      <form class="auth-form" id="loginForm">
        
        <div class="form-group">
          <label class="form-label" for="staffEmail">Staff Email or ID</label>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="staffEmail" class="form-input" placeholder="e.g. aseria@restaurant.com or 17129445521" required>
          </div>
        </div>

        <div class="form-group">
          <div class="form-label">
            <label for="staffPassword">Password</label>
            <a href="#" id="forgotPassLink">Forgot?</a>
          </div>
          <div class="input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="staffPassword" class="form-input" placeholder="••••••••" required>
            <button type="button" class="password-toggle" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember terminal</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Sign In to POS</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <div class="divider-row">
        <span>Or instant access</span>
      </div>

      <!-- Quick Demo Login Button -->
      <button type="button" class="btn-demo-login" id="demoStaffBtn">
        <span>⚡ Quick Terminal Demo (Aseria Staf)</span>
      </button>

      <!-- Footer Link to Register -->
      <div class="auth-footer">
        Don't have a staff terminal account?
        <a href="register.html">Register Staff</a>
      </div>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const authAlert = document.getElementById('authAlert');
    const demoStaffBtn = document.getElementById('demoStaffBtn');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const staffPassword = document.getElementById('staffPassword');

    // Toggle password visibility
    if (togglePasswordBtn && staffPassword) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPass = staffPassword.type === 'password';
        staffPassword.type = isPass ? 'text' : 'password';
      });
    }

    // Quick Demo Login
    if (demoStaffBtn) {
      demoStaffBtn.addEventListener('click', () => {
        const demoStaff = {
          name: 'Aseria Staf',
          id: '17129445521',
          email: 'aseria@restaurant.com',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'
        };
        localStorage.setItem('aseria_pos_staff', JSON.stringify(demoStaff));
        showAlert('Demo terminal authorized! Entering POS...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      });
    }

    // Submit Login form
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('staffEmail').value.trim();
        const password = staffPassword.value;

        showAlert('Authenticating with POS server...', 'success');

        // Check Supabase Auth if available
        if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient && window.supabaseClient.auth) {
          try {
            const { data, error } = await window.supabaseClient.auth.signInWithPassword({
              email: email.includes('@') ? email : `${email}@aseriapos.com`,
              password: password
            });

            if (error) {
              console.warn('Supabase auth notice:', error.message);
              // Fallback to local staff session
              completeStaffLogin(email);
              return;
            }

            const staffObj = {
              name: data.user?.user_metadata?.full_name || 'Aseria Staf',
              id: data.user?.id?.slice(0, 11) || '17129445521',
              email: data.user?.email || email,
              avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'
            };
            localStorage.setItem('aseria_pos_staff', JSON.stringify(staffObj));
            showAlert('Login successful! Redirecting...', 'success');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
            return;
          } catch (err) {
            console.warn(err);
          }
        }

        // Standard staff authorization
        completeStaffLogin(email);
      });
    }

    function completeStaffLogin(email) {
      const staffObj = {
        name: email.split('@')[0] || 'Aseria Staf',
        id: '17129445521',
        email: email,
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'
      };
      localStorage.setItem('aseria_pos_staff', JSON.stringify(staffObj));
      showAlert('Welcome back! Loading POS Dashboard...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 700);
    }

    function showAlert(msg, type) {
      if (!authAlert) return;
      authAlert.textContent = msg;
      authAlert.className = `alert-box ${type}`;
    }
  </script>
</body>
</html>
