<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Restaurants — Quvasoy Food Rescue</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="qfr-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
          </svg>
        </div>
        <span class="brand-text">Quvasoy Food Rescue</span>
      </a>
      <div class="header-right-actions">
        <a href="index.html" class="btn btn-primary-green">&larr; Bosh sahifaga qaytish</a>
      </div>
    </div>
  </header>
  <main class="section container" style="max-width: 680px; margin: 40px auto;">
    <div class="restaurant-cta-card" style="text-align: left;">
      <span class="cta-eyebrow">Hamkorlik portali</span>
      <h1 class="cta-title">Restoraningizni qo'shing</h1>
      <p class="cta-text">Quvasoy shahridagi oziq-ovqat isrofiga chek qo'ying. Ortiqcha yangi taomlaringizni tizimga joylang va muhtojlarga yoki arzon narxda shahar aholisiga yetkazing.</p>
      <a href="index.html#restaurants" class="btn btn-primary-green full-width">Bosh sahifada e'lon berish &rarr;</a>
    </div>
  </main>
</body>
</html>
